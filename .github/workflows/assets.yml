name: Update Profile Assets

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: VitzS7
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/snake.svg?palette=github-dark

      - name: Generate Streak
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          options: user=VitzS7&theme=tokyonight&hide_border=true&background=0d1117&ring=58a6ff&fire=58a6ff&currStreakLabel=58a6ff&sideLabels=c9d1d9&cache_bust=2
          path: dist/streak.svg

      # O deploy do github-readme-activity-graph.vercel.app foi desativado pelo Vercel
      # (HTTP 402 DEPLOYMENT_DISABLED) e passou a devolver texto puro. Como o curl antigo
      # salvava a resposta sem checar nada, o arquivo ia pro branch output com o texto de
      # erro e o GitHub renderizava imagem quebrada. Se as duas fontes caírem o job FALHA
      # de propósito: melhor manter o último SVG bom do que publicar lixo.
      - name: Generate Activity Graph
        run: |
          baixar_svg() {
            curl -fsSL --retry 3 --retry-delay 5 --max-time 45 -o "$2" "$1" || return 1
            if ! head -c 500 "$2" | grep -q "<svg"; then
              echo "::warning::resposta de $1 não é SVG"
              rm -f "$2"
              return 1
            fi
          }

          mkdir -p dist

          baixar_svg "https://github-profile-summary-cards.vercel.app/api/cards/profile-details?username=VitzS7&theme=github_dark" dist/activity.svg \
            || baixar_svg "https://ghchart.rshah.org/58a6ff/VitzS7" dist/activity.svg \
            || { echo "::error::nenhuma fonte de activity graph respondeu"; exit 1; }

      - name: Generate Stats Badges
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dados=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/users/VitzS7) || exit 1

          seguidores=$(echo "$dados" | jq -r '.followers // 0')
          repos=$(echo "$dados" | jq -r '.public_repos // 0')
          estrelas=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/users/VitzS7/repos?per_page=100&type=owner" \
            | jq 'if type == "array" then ([.[].stargazers_count] | add // 0) else 0 end')

          mkdir -p dist

          curl -fsSL -o dist/repos.svg "https://img.shields.io/badge/Repos-${repos}-58a6ff?style=for-the-badge&logo=github&logoColor=white"
          curl -fsSL -o dist/stars.svg "https://img.shields.io/badge/Stars-${estrelas}-58a6ff?style=for-the-badge&logo=github&logoColor=white"
          curl -fsSL -o dist/followers.svg "https://img.shields.io/badge/Followers-${seguidores}-58a6ff?style=for-the-badge&logo=github&logoColor=white"

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
