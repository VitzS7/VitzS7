name: Update Profile Assets

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: VitzS7
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/snake.svg?palette=github-dark

      - name: Generate Streak
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          options: user=VitzS7&theme=tokyonight&hide_border=true&background=0d1117&ring=58a6ff&fire=58a6ff&currStreakLabel=58a6ff&sideLabels=c9d1d9&cache_bust=2
          path: dist/streak.svg

      - name: Generate Activity Graph
        run: |
          curl -s -o dist/activity.svg \
            "https://github-readme-activity-graph.vercel.app/graph?username=VitzS7&bg_color=0d1117&color=58a6ff&line=58a6ff&point=ffffff&area=true&area_color=58a6ff&hide_border=true"

      - name: Generate Stats Badges
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          USER=$(curl -s -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/users/VitzS7)
          FOLLOWERS=$(echo "$USER" | jq -r '.followers // "?"')

          REPOS_PUBLIC=$(echo "$USER" | jq -r '.public_repos // 0')
          REPOS_PRIVATE=$(echo "$USER" | jq -r '.total_private_repos // 0')
          REPOS=$((REPOS_PUBLIC + REPOS_PRIVATE))

          STARS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/users/VitzS7/repos?per_page=100" | jq 'if type == "array" then [.[].stargazers_count] | add // 0 else 0 end')

          curl -s -o dist/repos.svg "https://img.shields.io/badge/Repos-${REPOS}-58a6ff?style=flat-square&logo=github&logoColor=white"
          curl -s -o dist/stars.svg "https://img.shields.io/badge/Stars-${STARS}-58a6ff?style=flat-square&logo=github&logoColor=white"
          curl -s -o dist/followers.svg "https://img.shields.io/badge/Followers-${FOLLOWERS}-58a6ff?style=flat-square&logo=github&logoColor=white"

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
